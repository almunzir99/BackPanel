<data-table (createClick)="onCreate()" (searchChange)="onSearch($event)" (sortChange)="onSortChange($event)"
    (pageChange)="onPageChange($event)" [total]="totalRecords" (exportClick)="onExportClick($event)"
    [loading]="getRequest == 1" [columns]="columns" [rows]="data" [cell-template]="cellTemplate" [title]="'Roles'">
    <ng-template #cellTemplate let-rowData="rowData" let-data="cellData" let-col="colIndex" let-row="rowIndex">
        <ng-container [ngSwitch]="col">
            <ng-container *ngSwitchCase="4">
                <button (click)="onUpdate(rowData)" matRipple class="table-act-button accent">
                    <i class="las la-edit"></i>
                </button>
                <button (click)="onDeleteClick(rowData.id)" matRipple class="table-act-button warn">
                    <i class="las la-trash"></i>
                </button>
            </ng-container>
            <ng-container *ngSwitchDefault>{{data}}</ng-container>
        </ng-container>
    </ng-template>
</data-table>

<dimmer-loading *ngIf="dimRequest == 1"></dimmer-loading>

<ng-template #roleForm>
    <div [dir]="dir">
        <h2 mat-dialog-title [textContent]="role.id == 0 ? ('Dashboard.CreateNewRole' | translate) : ('Dashboard.EditRole' | translate)"></h2>

        <mat-dialog-content class="role-form-content">

            <!-- Role name field -->
            <mat-form-field class="full-width">
                <mat-label>{{'Dashboard.RoleTitle' | translate}} {{'Dashboard.RoleNameHint' | translate}}</mat-label>
                <input [(ngModel)]="role.title" type="text" matInput placeholder="e.g. ContentManager" name="title">
            </mat-form-field>

            <!-- ── Permissions Tree (unlimited depth via recursive ng-template) ───── -->
            <div class="permissions-section">
                <div class="permissions-header">{{'Dashboard.Permissions' | translate}}</div>

                <div *ngIf="permissionsLoading" class="permissions-loading">
                    {{'Dashboard.Loading' | translate}}
                </div>

                <ng-container *ngIf="!permissionsLoading">

                    <!-- Self-referencing recursive template — works at any depth -->
                    <ng-template #nodeTemplate let-nodes="nodes" let-depth="depth">
                        <ng-container *ngFor="let node of nodes">

                            <!-- Leaf node: just a checkbox -->
                            <div *ngIf="!node.children" class="perm-leaf-wrapper">
                                <mat-checkbox
                                    [(ngModel)]="node.checked"
                                    (ngModelChange)="onLeafChange()"
                                    [name]="node.value"
                                    color="primary">
                                    {{ ('Dashboard.Perm_' + node.label) | translate }}
                                </mat-checkbox>
                            </div>

                            <!-- Branch node: collapsible header + recursive children -->
                            <div *ngIf="node.children" class="perm-branch-wrapper">
                                <div class="perm-row" [class]="'perm-depth-' + depth" (click)="node.expanded = !node.expanded">
                                    <mat-checkbox
                                        [checked]="node.allChecked"
                                        [indeterminate]="node.someChecked"
                                        (change)="setBranchChecked(node, $event.checked)"
                                        (click)="$event.stopPropagation()"
                                        color="primary">
                                        <span class="perm-label">{{ ('Dashboard.Perm_' + node.label) | translate }}</span>
                                    </mat-checkbox>
                                    <i class="las perm-chevron"
                                       [class.la-angle-down]="node.expanded"
                                       [class.la-angle-up]="!node.expanded"></i>
                                </div>
                                <div *ngIf="node.expanded" class="perm-children">
                                    <ng-container *ngTemplateOutlet="nodeTemplate; context: { nodes: node.children, depth: depth + 1 }"></ng-container>
                                </div>
                            </div>

                        </ng-container>
                    </ng-template>

                    <!-- Kick off the tree at depth 0 -->
                    <div class="permission-tree">
                        <ng-container *ngTemplateOutlet="nodeTemplate; context: { nodes: permTree, depth: 0 }"></ng-container>
                    </div>

                </ng-container>
            </div>
        </mat-dialog-content>

        <mat-dialog-actions>
            <button (click)="onFormSubmit()" mat-flat-button color="primary">{{'Dashboard.SUBMIT' | translate}}</button>
            <button (click)="closeDialog()" mat-stroked-button>{{'Dashboard.CANCEL' | translate}}</button>
        </mat-dialog-actions>
    </div>
</ng-template>
